[package]
name = "analysis-template"
version = "1.4.0"
edition = "2021"
default-run = "cli"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
bitbuffer = "0.11.1"
getopts = "0.2.23"
itertools = "0.14.0"
lazy_static = "1.5.0"
mimalloc = { version = "0.1", default-features = false }
num_cpus = "1.16"
opener = "0.8.2"
rfd = { version = "0.15.3", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
steamid-ng = "3.0.0"
tf-demo-parser = "0.6.4"
ureq = "2.12.1"
web-time = "1.1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lzma-rs = "0.3"
snap = "1.1"

eframe = { version = "0.31.1", optional = true }
egui = { version = "0.31.1", optional = true }
rayon = { version = "1.10", optional = true }
unsafe-libopus = { version = "0.2.0", optional = true }

[features]
gui = [ "eframe", "egui", "dep:rfd" ]
experimental = [ "dep:unsafe-libopus" ]
parallel = [ "dep:rayon" ]
rcon = [ "gui" ]
tf2bd = []

[[bin]]
name = "gui"
required-features = [ "gui" ]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[patch.crates-io]
# steamid-ng 3.0 from crates.io is used; the old patched 1.0 copy is kept in vendor/steamid-ng as a backup.
# steamid-ng = { path = "vendor/steamid-ng" }
tf-demo-parser = { path = "vendor/tf-demo-parser" }

